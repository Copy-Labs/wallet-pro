<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EIP-6963 Wallet Chooser Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f7f9fc;
        color: #222;
        margin: 0;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .wallet-list {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 1.5rem;
      }
      button {
        padding: 0.8rem 1.2rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #007bff;
        color: white;
        font-weight: 500;
        transition: 0.2s ease;
      }
      button:hover {
        background: #0056b3;
      }
      .provider {
        border: 1px solid #ccc;
        padding: 1rem;
        border-radius: 8px;
        width: 220px;
        background: white;
        text-align: center;
      }
      .provider img {
        border-radius: 50%;
      }
      .actions {
        margin-top: 2rem;
      }
      pre {
        background: #f1f3f8;
        padding: 1rem;
        border-radius: 6px;
        margin-top: 1rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>EIP-6963 Wallet Chooser Demo</h1>
    <p>
      This demo simulates MetaMask, Rabby, and Smart Wallet announcing
      themselves via <strong>EIP-6963</strong>. Open the console to observe how
      your Smart Wallet extension reacts.
    </p>

    <div class="wallet-list" id="walletList"></div>

    <div class="actions">
      <button id="btnRequest">
        Request Connection (simulate DApp connect)
      </button>
      <pre id="result"></pre>
    </div>

    <script>
      // --- Mock Provider Factories ---
      function createMockProvider(name, icon, uuid) {
        const provider = {
          isEIP6963: true,
          name,
          request: async ({ method }) => {
            console.log(`[${name}] received request:`, method)
            if (method === "eth_requestAccounts") {
              const fakeAddress =
                "0x" + Math.random().toString(16).substring(2, 42)
              console.log(`[${name}] returning: ${fakeAddress}`)
              return [fakeAddress]
            }
            return null
          }
        }
        return {
          info: {
            uuid,
            name,
            icon,
            rdns: `${name.toLowerCase()}.wallet`
          },
          provider
        }
      }

      const mockWallets = [
        createMockProvider(
          "MetaMask",
          "https://metamask.io/images/favicon-256.png",
          "11111111-1111-1111-1111-111111111111"
        ),
        createMockProvider(
          "Rabby",
          "https://rabby.io/logo.png",
          "22222222-2222-2222-2222-222222222222"
        ),
        createMockProvider(
          "Smart Wallet",
          "https://example.com/smart-wallet-icon.png",
          "33333333-3333-3333-3333-333333333333"
        )
      ]

      // --- Announce providers via EIP-6963 ---
      function announceAllProviders() {
        for (const wallet of mockWallets) {
          const event = new CustomEvent("eip6963:announceProvider", {
            detail: wallet
          })
          window.dispatchEvent(event)
          console.log(`[EIP6963] Announced: ${wallet.info.name}`)
        }
      }

      announceAllProviders()

      // Re-announce when page dispatches requestProvider
      window.addEventListener("eip6963:requestProvider", () => {
        console.log("DApp requested providers — re-announcing")
        announceAllProviders()
      })

      // --- Render provider cards ---
      const walletList = document.getElementById("walletList")
      mockWallets.forEach((wallet) => {
        const div = document.createElement("div")
        div.className = "provider"
        div.innerHTML = `
          <img src="${wallet.info.icon}" width="40" height="40" alt="${wallet.info.name}" />
          <h3>${wallet.info.name}</h3>
          <button>Simulate Connect</button>
        `
        div.querySelector("button").addEventListener("click", async () => {
          const resultEl = document.getElementById("result")
          const accounts = await wallet.provider.request({
            method: "eth_requestAccounts"
          })
          resultEl.textContent = `${wallet.info.name} connected: ${accounts[0]}`
        })
        walletList.appendChild(div)
      })

      // --- Simulate a DApp connection using window.ethereum (EIP-1193) ---
      document
        .getElementById("btnRequest")
        .addEventListener("click", async () => {
          const resultEl = document.getElementById("result")
          try {
            // In a real DApp this triggers your Plasmo Smart Wallet content script
            const accounts = await window.ethereum.request({
              method: "eth_requestAccounts"
            })
            console.log("Connected via Smart Wallet:", accounts)
            resultEl.textContent = `DApp connected with: ${accounts}`
          } catch (err) {
            console.error("Connection error:", err)
            resultEl.textContent = `❌ Connection failed: ${err.message}`
          }
        })
    </script>
  </body>
</html>
